name: CI

# Tests every change, builds the Docker image and starts it once. Changes to main publish the
# image to ghcr.io/sg303/batzen. A weekly rebuild picks up security fixes in the base image.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sg303/batzen

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in sync with the Dockerfile
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: batzen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait until it is healthy
        run: |
          docker run -d --name batzen -p 3000:3000 --health-interval=2s --health-start-period=0s batzen:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' batzen)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs batzen
          [ "$status" = healthy ] || { echo "Container is $status"; exit 1; }
          # A fresh database shows the setup page
          curl -fsS -o /dev/null http://localhost:3000/einrichten

      - name: Tags
        id: meta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/login-action@v4
        if: steps.meta.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Merges Dependabot updates that passed, except major versions, which need a human look.
  automerge:
    needs: image
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR" --squash --delete-branch
          # Merges made with GITHUB_TOKEN do not trigger workflows, so publish the image explicitly
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

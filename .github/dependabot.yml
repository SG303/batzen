# Dependabot config (baseline v2). Weekly updates, grouped into one pull request per
# ecosystem. CI merges minor and patch updates automatically once the tests and the image
# pass (see .github/workflows/ci.yml); majors and updates of unknown type stay open.
# The 7-day cooldown skips versions younger than a week; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

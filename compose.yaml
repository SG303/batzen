services:
  batzen:
    # Defaults to the release this file belongs to (updated by every release). To update or roll
    # back, set BATZEN_TAG in .env, e.g. BATZEN_TAG=0.3.0, BATZEN_TAG=sha-1a2b3c4 or BATZEN_TAG=latest
    # (the tags are listed on the package page on GitHub).
    image: ghcr.io/sg303/batzen:${BATZEN_TAG:-0.2.4}
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - batzen-data:/data
      # Nightly backups and the copies taken before an update changes the database. Set
      # BACKUP_PATH in .env to a folder on another device (e.g. a NAS mount like
      # /mnt/nas/batzen); without it they go to the volume "batzen-backups".
      - ${BACKUP_PATH:-batzen-backups}:/backups

volumes:
  batzen-data:
  batzen-backups:
